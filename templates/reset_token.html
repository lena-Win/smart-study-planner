{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen">
<form method="POST" class="glass w-full max-w-md rounded-3xl p-8">
<h1 class="text-3xl font-bold mb-6">
Set new password
</h1>
<input 
type="password" 
name="password"
placeholder="New password"
class="w-full p-4 rounded-2xl bg-white/60 border border-white/40 mb-4">
<button class="w-full py-4 rounded-2xl bg-gray-900 text-white glow-button">
Reset Password
</button>
</form>
</div>
{% endblock %}
