{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen">
<form method="POST" class="glass w-full max-w-md rounded-3xl p-8">
<h1 class="text-4xl font-extrabold mb-6">
Create account
</h1>
<input
name="username"
placeholder="Username"
class="w-full p-4 rounded-2xl bg-white/60 border border-white/40 mb-4">
<input 
name="email"
placeholder="Email"
class="w-full p-4 rounded-2xl bg-white/60 border border-white/40 mb-4">
<input
name="password"
type="password"
placeholder="Password"
class="w-full p-4 rounded-2xl bg-white/60 border border-white/40 mb-5">
<button class="w-full py-4 rounded-2xl bg-gray-900 text-white glow-button">
Create account
</button>
<a href="/login" class="block mt-5 text-sm text-gray-600">
Back to login
</a>
</form>
</div>
{% endblock %}
